<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pronunciagotchi - RPG de Pronúncia</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1 id="levelBadge">Nível 1: Rolê & Café</h1>
        <span id="headerPetInfo" class="badge">🥚 Ovo Misterioso</span>
      </div>
      <div class="header-right">
        <div class="coins">🪙 <span id="coinCount">20</span></div>
      </div>
    </header>

    <div class="xp-container">
      <div class="xp-label">
        <span id="xpTitle">Progresso do Ovo</span>
        <span id="xpText">0 / 100 XP</span>
      </div>
      <progress id="xpBar" value="0" max="100"></progress>
    </div>

    <section class="pet-card">
      <div id="petAvatar" class="pet">🥚</div>
      <div id="petMood" class="mood">Um ovo misterioso... Pratique para chocar!</div>
      <div class="bars">
        <label>❤️ Humor: <progress id="happyBar" value="60" max="100"></progress></label>
        <label>🍔 Fome: <progress id="hungerBar" value="50" max="100"></progress></label>
        <label>💊 Saúde: <progress id="healthBar" value="100" max="100"></progress></label>
      </div>
      <div class="shop">
        <button onclick="feedPet()">🍗 Alimentar (10)</button>
        <button onclick="playWithPet()">🎾 Brincar (10)</button>
        <button onclick="buyAccessory()">🕶️ Acessório (30)</button>
        <button onclick="giveMedicine()">💊 Remédio (15)</button>
      </div>
    </section>

    <section class="practice-card">
      <div class="top-controls">
        <select id="langSelect" onchange="loadNextPhrase()">
          <option value="pt-BR" selected>Português (Brasil)</option>
          <option value="en-US">Inglês (US)</option>
          <option value="es-ES">Espanhol (ES)</option>
          <option value="fr-FR">Francês (FR)</option>
        </select>

        <label class="blind-toggle">
          <input type="checkbox" id="blindMode" onchange="toggleBlindMode()" />
          👂 Só Ouvido
        </label>
      </div>

      <div class="dialogue-box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span class="context-tag" id="contextTag">Na lanchonete</span>
          <button onclick="toggleTranslation()" style="font-size:0.7rem; padding:2px 6px; background:#1e293b; color:#38bdf8;">🌐 Tradução</button>
        </div>
        <h2 id="targetPhrase">Carregando...</h2>
        <p id="phraseHint">Dica: Fale sem travar as palavras</p>
        <p id="translationBox" style="font-size: 0.8rem; color: #38bdf8; margin-top: 6px; display: none;"></p>
      </div>

      <div class="audio-controls">
        <button onclick="speakTarget(1.0)">🔊 Velocidade Real</button>
        <button onclick="speakTarget(0.7)">🐢 Devagar (0.7x)</button>
        <button onclick="loadNextPhrase()">⏭️ Pular</button>
      </div>

      <button id="micBtn" class="mic-btn" onclick="startListening()">🎤 Toque e Fale</button>
      <div id="feedback" class="feedback">Ouça o áudio e repita naturalmente!</div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
